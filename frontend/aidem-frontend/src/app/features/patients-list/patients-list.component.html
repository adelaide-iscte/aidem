<div class="patients-page">
  <header class="header">
    <img src="/icons/menu.svg" class="menu-icon" (click)="openSideMenu()" />

    <div class="top-icons">
      <img
        src="/icons/bell.svg"
        class="top-icon"
        (click)="toggleNotifications()"
      />
      <img
        [src]="headerAvatar"
        class="avatar"
        alt="Perfil"
      />
    </div>
  </header>

  <main class="content">
    <section class="toolbar">
      <div class="search-wrapper">
        <span class="search-icon" aria-hidden="true"></span>

        <input
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="Pesquisar"
        />

        <button
          *ngIf="searchTerm"
          type="button"
          class="clear-button"
          (click)="clearSearch()">
          ×
        </button>
      </div>

      <button type="button" class="sort-button" (click)="toggleSortMode()">
        <span>{{ sortMode === 'recent' ? 'Mais recentes' : 'A-Z' }}</span>
      </button>

      <button type="button" class="add-button" (click)="createPatient.emit()">
        + Adicionar paciente
      </button>
    </section>

    <section class="patients-card">
      <div class="patients-scroll">
        <div
          class="patient-item"
          *ngFor="
    let patient of filteredPatients;
    trackBy: trackByPatientCode
  ">

          <button
            type="button"
            class="patient-details"
            (click)="openPatient(patient)">

            <img
              [src]="patient.avatar"
              class="patient-avatar"
              alt="" />

            <div class="patient-copy">
              <h2>{{ patient.name }}</h2>

              <p>
                <span>{{ patient.age }} anos</span>
                <strong>|</strong>
                {{ patient.code }}
              </p>
            </div>
          </button>

          <button
            *ngIf="canDeletePatients"
            type="button"
            class="delete-patient-button"
            [attr.aria-label]="'Remover ' + patient.name"
            [attr.title]="'Remover ' + patient.name"
            (click)="openDeleteModal(patient)">

            <img
              src="/icons/trash.svg"
              alt=""
              aria-hidden="true" />
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="bottom-nav">
    <div class="active">
      <img src="/icons/doctor.svg" />
      <span>Profissional</span>
    </div>
  </footer>

  <app-notifications-popover
    *ngIf="showNotifications"
    (close)="closeNotifications()">
  </app-notifications-popover>

  <div
    *ngIf="showDeleteModal"
    class="delete-modal-backdrop"
    (click)="closeDeleteModal()">

    <section
      class="delete-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="delete-patient-modal-title"
      (click)="$event.stopPropagation()">

      <h2 id="delete-patient-modal-title">
        Remover utente?
      </h2>

      <p
        *ngIf="deleteError"
        class="delete-error"
        role="alert">
        {{ deleteError }}
      </p>

      <button
        type="button"
        class="confirm-delete-button"
        [disabled]="deletingPatientId !== null"
        (click)="confirmDelete()">

        {{
          deletingPatientId !== null
            ? 'A remover...'
            : 'Sim'
        }}
      </button>

      <button
        type="button"
        class="cancel-delete-button"
        [disabled]="deletingPatientId !== null"
        (click)="closeDeleteModal()">

        Cancelar
      </button>
    </section>
  </div>
</div>

<app-side-menu
  *ngIf="showSideMenu"
  (close)="closeSideMenu()"
  (changePatient)="openPatients.emit(); closeSideMenu()"
  (openContents)="openContents.emit(); closeSideMenu()"
  [isAdmin]="isAdmin"
  (openAdminActivities)="
    openAdminActivities.emit();
    closeSideMenu()
  "
  (openUserManagement)="
  openUserManagement.emit();
  closeSideMenu()
"
  (logout)="
    logout.emit();
    closeSideMenu()
  ">
</app-side-menu>
