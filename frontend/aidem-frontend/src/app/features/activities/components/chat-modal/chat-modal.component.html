<div class="modal-backdrop">
  <div class="chat-page">
    <header class="header">
      <div class="left-actions">
        <img src="/icons/menu.svg" class="menu-icon" (click)="openSideMenu()" />

        <button class="back-button" type="button" (click)="closeModal()">
          <span class="back-arrow">‹</span>
          <span>Voltar</span>
        </button>
      </div>

      <div class="top-icons">
        <img src="/icons/bell.svg" class="top-icon" />
        <img
          [src]="headerAvatar"
          class="avatar"
          alt="Perfil"
        />
      </div>
    </header>

    <section class="professional-card">
      <img
        [src]="contactAvatar"
        class="professional-avatar"
        [alt]="contactName"
      />

      <div class="professional-info">
        <div class="professional-name-row">
          <h1>{{ contactName }}</h1>

          <span
            *ngIf="contact"
            class="online-dot">
      </span>

          <span
            *ngIf="contact"
            class="online-text">
        Disponível
      </span>
        </div>

        <p>{{ contactRole }}</p>
      </div>

      <img
        src="/icons/Phone_2.svg"
        class="call-icon"
        [class.disabled]="!contact"
        alt="Iniciar chamada"
        (click)="openCallOverlay()"
      />
    </section>

    <section class="chat-main">
      <main
        #messagesContainer
        class="chat-content"
        aria-live="polite">

        <div
          *ngIf="isLoadingChat"
          class="chat-state">
          A carregar mensagens...
        </div>

        <div
          *ngIf="!isLoadingChat && chatError"
          class="chat-state error-state">
          {{ chatError }}
        </div>

        <div
          *ngIf="
        !isLoadingChat &&
        !chatError &&
        messages.length === 0
      "
          class="chat-state empty-state">

          <strong>Ainda não existem mensagens.</strong>
          <span>Envie a primeira mensagem desta conversa.</span>
        </div>

        <article
          *ngFor="
        let chatMessage of messages;
        trackBy: trackByMessageId
      "
          class="message-row"
          [class.sent]="chatMessage.mine"
          [class.received]="!chatMessage.mine">

          <p class="message">
            {{ chatMessage.content }}
          </p>

          <time
            class="time"
            [attr.datetime]="chatMessage.sentAt">
            {{ formatMessageTime(chatMessage.sentAt) }}
          </time>
        </article>
      </main>

      <section class="chat-input-area">
        <p
          *ngIf="sendError"
          class="send-error">
          {{ sendError }}
        </p>

        <div class="chat-input-shell">
          <input
            [(ngModel)]="message"
            maxlength="2000"
            [disabled]="
          isLoadingChat ||
          isSendingMessage ||
          !contact
        "
            placeholder="Escreva uma mensagem..."
            (keyup.enter)="sendMessage()"
          />

          <button
            type="button"
            aria-label="Enviar mensagem"
            [disabled]="!canSendMessage"
            (click)="sendMessage()">

            <img
              src="/icons/send.svg"
              alt=""
            />
          </button>
        </div>
      </section>
    </section>

    <footer class="bottom-nav">
      <div class="active" (click)="openActivities.emit()">
        <img src="/icons/atividade_marked.svg" />
        <span>Atividades</span>
      </div>

      <div (click)="goHome.emit()">
        <img src="/icons/Home_unmarked.svg" />
        <span>Início</span>
      </div>

      <div>
        <div (click)="openProfile.emit()">
          <img src="/icons/person.svg" />
        <span>Perfil</span>
        </div>
      </div>
    </footer>
  </div>

  <app-call-overlay
    *ngIf="showCallOverlay"
    [name]="contactName"
    status="A chamar ..."
    [avatar]="contactAvatar"
    (endCall)="closeCallOverlay()">
  </app-call-overlay>


  <app-side-menu
    *ngIf="showSideMenu"
    (close)="closeSideMenu()"
    (changePatient)="openPatients.emit(); closeSideMenu()"
    (openContents)="openContents.emit(); closeSideMenu()"
    [isAdmin]="isAdmin"
    (openAdminActivities)="openAdminActivities.emit();closeSideMenu()"
    (openMessages)="openChat.emit(); closeSideMenu()"
    (openUserManagement)="openUserManagement.emit();closeSideMenu()">
  </app-side-menu>
</div>
