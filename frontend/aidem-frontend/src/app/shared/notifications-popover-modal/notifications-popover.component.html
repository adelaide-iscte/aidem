<div
  class="notifications-backdrop"
  (click)="close.emit()">
</div>

<section class="notifications-popover">
  <header>
    <h2>Notificações</h2>
  </header>

  <div
    class="notification-item"
    *ngFor="let notification of notificationService.notifications()">

    <div class="notification-icon">
      <img
        src="/icons/atividade_marked.svg"
        alt=""
      />
    </div>

    <div class="notification-content">
      <h3>{{ notification.title }}</h3>

      <p>{{ notification.text }}</p>

      <span>{{ notification.time }}</span>
    </div>
  </div>

  <div
    class="empty-notifications"
    *ngIf="notificationService.notifications().length === 0">

    <p>Não tem novas notificações.</p>
  </div>
</section>
